name: CI Pipeline

on:
  pull_request:
    branches: [main, dev]
  workflow_call:

jobs:
  # Job 1: ESLint
  lint:
    name: ESLint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # Job 2: Vitest (depende de lint)
  test:
    name: Vitest Tests
    runs-on: ubuntu-latest
    needs: lint # ← Espera a que 'lint' termine exitosamente

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test
